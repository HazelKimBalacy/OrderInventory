spring.application.name=Activity02

# --- Supabase (Postgres) connection ---------------------------------------
# Never hardcode credentials here. These are read from environment
# variables at startup, see README "Environment variables" section.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables are created/seeded by sql/schema.sql, not by Hibernate, so we only
# ever validate that the entities match what's actually in Supabase.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- CORS -------------------------------------------------------------------
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

server.port=${SERVER_PORT:8080}

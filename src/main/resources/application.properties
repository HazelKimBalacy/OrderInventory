spring.application.name=Activity02

# --- Supabase (Postgres) connection ---------------------------------------
# Never hardcode credentials here. These are read from environment
# variables at startup, see README "Environment variables" section.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Supabase pooled connections can be reassigned across backend transactions.
# Avoid named server-side prepared statements which may leak across pool clients.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Tables are created/seeded by sql/schema.sql, not by Hibernate, so we only
# ever validate that the entities match what's actually in Supabase.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Business rules ---------------------------------------------------------
# Any successful reserve() that leaves stock strictly below this value
# publishes a LowStockEvent, which the Notification module logs as a
# "reorder needed" entry. Also drives the lowStock flag on GET /api/inventory.
app.inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}

# --- CORS -------------------------------------------------------------------
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

server.port=${SERVER_PORT:8080}

# Secrets come from environment variables: LS_CLIENT_ID (student id) and LS_API_KEY.
supplier.base-url=${LS_BASE_URL:https://legacysupply.onrender.com/api/v1}
supplier.client-id=${LS_CLIENT_ID:}
supplier.api-key=${LS_API_KEY:}

supplier.connect-timeout-ms=2000
supplier.read-timeout-ms=3000
# Set to the session lifetime you MEASURE (seconds, minus a safety margin). 0 = only re-login on rejection.
supplier.session-ttl-seconds=0

# Reorder up to this stock level (units needed = target - remaining stock, rounded up to whole cases)
supplier.reorder-target-stock=20

supplier.submit-interval-ms=10000
supplier.poll-interval-ms=30000
# Quota guard: max PO status lookups per polling run
supplier.max-status-checks-per-run=10

# productId:SupplierSku:PackSize  (fill in from GET /catalog; comma separated)
# Example: supplier.catalog=P100:ABC-1234:12,P200:DEF-5678:6,P400:GHI-9012:4
supplier.catalog=${SUPPLIER_CATALOG:}
supplier.catalog-refresh-ms=3600000

# Cancellation status code(s) copied from the 'Unexpected supplier status' log line, comma separated.
supplier.cancelled-codes=${SUPPLIER_CANCELLED_CODES:}

# --- Tiangge marketplace channel ------------------------------------------
# Uses the Lab 3 student ID and API key; credentials remain environment-only.
channel.base-url=${TIANGGE_BASE_URL:https://legacysupply.onrender.com/tiangge/v1}
channel.client-id=${LS_CLIENT_ID:}
channel.api-key=${LS_API_KEY:}
